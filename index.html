<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北淡院區護理人力休假儀表板</title>
  <style>
    :root {
      --ink: #102a43;
      --muted: #5f6c7b;
      --line: #d8e1e8;
      --surface: #f5f8fa;
      --panel: #ffffff;
      --teal: #12343b;
      --red: #b42318;
      --green: #087443;
      --yellow: #d97706;
      --blue: #145c72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--surface);
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      letter-spacing: 0;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--teal);
      color: white;
      border-bottom: 1px solid rgba(255,255,255,0.16);
    }
    .header-inner {
      max-width: 1520px;
      margin: 0 auto;
      padding: 14px 20px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
    }
    main {
      max-width: 1520px;
      margin: 0 auto;
      padding: 16px 20px 28px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 320px) minmax(280px, 1fr);
      gap: 10px;
      margin-bottom: 14px;
      align-items: end;
    }
    .control {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 74px;
    }
    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
      font-weight: 800;
    }
    select {
      width: 100%;
      min-height: 34px;
      border: 1px solid #c8d2dc;
      border-radius: 6px;
      background: white;
      color: var(--ink);
      padding: 6px 9px;
      font-size: 14px;
      font-weight: 700;
    }
    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      margin-bottom: 14px;
      overflow: visible;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
    }
    .small-action {
      border: 1px solid #cbd5e1;
      background: white;
      color: var(--ink);
      border-radius: 6px;
      min-height: 32px;
      padding: 5px 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
    }
    .table-wrap {
      overflow: visible;
      border: 1px solid #e5edf3;
      border-radius: 7px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
      background: white;
      min-width: 0;
    }
    col.campus { width: 7.5%; }
    col.department { width: 6%; }
    col.unit { width: 7.5%; }
    col.rate { width: 5.5%; }
    col.gap { width: 6.5%; }
    col.staff { width: 10%; }
    col.shift-count { width: 6%; }
    col.need { width: 7%; }
    col.remaining { width: 7.5%; }
    col.average { width: 6.5%; }
    col.signal-col { width: 6%; }
    col.shift-small { width: 3.7%; }
    col.shift-total { width: 4.5%; }
    th {
      position: sticky;
      z-index: 2;
      background: #e8eef3;
      color: #243b53;
      border: 1px solid var(--line);
      padding: 7px 5px;
      text-align: center;
      white-space: normal;
      font-weight: 850;
      line-height: 1.25;
    }
    thead tr:first-child th { top: 0; }
    thead tr:nth-child(2) th { top: 35px; }
    td {
      border: 1px solid #edf2f7;
      padding: 6px 5px;
      vertical-align: middle;
      white-space: normal;
      line-height: 1.25;
    }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .left { text-align: left; }
    .group-head { background: #ffffff; }
    .highlight { background: #ffff00; }
    .shift-head,
    .shift-cell {
      font-size: 12px;
    }
    .shift-cell {
      padding-left: 3px;
      padding-right: 3px;
    }
    .emphasis-col {
      font-weight: 850;
      color: var(--red);
      background: #fff4ed;
    }
    th.emphasis-col {
      background: #ffe08a;
    }
    .signal {
      display: inline-block;
      color: white;
      border-radius: 999px;
      padding: 3px 10px;
      min-width: 56px;
      text-align: center;
      font-weight: 850;
      font-size: 13px;
    }
    .signal-red { background: var(--red); }
    .signal-green { background: var(--green); }
    .signal-yellow { background: var(--yellow); }
    .signal-missing { background: #64748b; }
    .chart svg {
      width: 100%;
      min-width: 980px;
      height: auto;
      display: block;
    }
    .axis { stroke: #94a3b8; stroke-width: 1; }
    .gridline { stroke: #d9e2ec; stroke-dasharray: 3 3; stroke-width: 1; }
    .bar-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 800;
      dominant-baseline: middle;
    }
    .tick {
      fill: #64748b;
      font-size: 12px;
    }
    .bar-name {
      fill: #334155;
      font-size: 14px;
      font-weight: 800;
      dominant-baseline: middle;
    }
    @media (max-width: 1100px) {
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>北淡院區護理人力休假儀表板</h1>
    </div>
  </header>
  <main>
    <section class="toolbar" aria-label="篩選列">
      <div class="control">
        <label for="campus">院區</label>
        <select id="campus">
          <option value="全部院區">全部院區</option>
          <option value="台北院區">台北院區</option>
          <option value="淡水院區">淡水院區</option>
        </select>
      </div>
      <div class="control">
        <label for="departmentFilter">科別</label>
        <select id="departmentFilter"></select>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>單位明細</h2>
        <button class="small-action" id="downloadCsv" type="button">下載 CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col class="campus">
            <col class="department">
            <col class="unit">
            <col class="rate">
            <col class="rate">
            <col class="gap">
            <col class="staff">
            <col class="shift-count">
            <col class="need">
            <col class="remaining">
            <col class="average">
            <col class="signal-col">
            <col class="shift-small">
            <col class="shift-small">
            <col class="shift-small">
            <col class="shift-total">

          <thead>

              <th rowspan="2" class="emphasis-col">剩餘之休假<br>人/日/數</th>
              <th rowspan="2">平均剩餘<br>人力</th>
              <th rowspan="2">紅綠燈</th>
              <th colspan="4" class="group-head shift-head">三班排班人數</th>
            </tr>
            <tr>
              <th class="highlight">在職率</th>
              <th class="highlight emphasis-col">開床-在職</th>
              <th class="highlight">人數</th>
              <th>可排<br>班數</th>
              <th class="shift-head">D</th>
              <th class="shift-head">E</th>
              <th class="shift-head">N</th>
              <th class="shift-head">小計</th>
            </tr>
          </thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel chart">
      <h2 id="chartTitle">平均剩餘人力</h2>
      <div id="riskChart"></div>
    </section>
  </main>

      const bars = data.map((row, idx) => {
        const y = top + idx * rowH + 6;
        const valueX = left + ((n(row.avgRemaining) - min) / span) * plotW;
        const x = Math.min(baselineX, valueX);
        const w = Math.max(2, Math.abs(valueX - baselineX));
        const value = n(row.avgRemaining);
        const overBaseline = value > baseline;
        const color = value > baseline ? "#b42318" : value < baseline ? "#087443" : "#d97706";
        const labelX = overBaseline ? x + w + 6 : x - 6;
        const anchor = overBaseline ? "start" : "end";
        return '<text class="bar-name" x="8" y="' + (y + 11) + '">' + escapeHtml(chartLabel(row).slice(0, 22)) + '</text>' +
          '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="22" rx="4" fill="' + color + '"></rect>' +
          '<text class="bar-label" x="' + labelX + '" y="' + (y + 11) + '" text-anchor="' + anchor + '">' + format(row.avgRemaining) + '</text>';
      }).join("");
      container.innerHTML = '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img">' +
        tickSvg +
        '<line class="axis" x1="' + baselineX + '" y1="' + (top - 8) + '" x2="' + baselineX + '" y2="' + (height - 22) + '"></line>' +
        bars +
      '</svg>';
    }
    function renderDetails(rows) {
      document.querySelector("#detailBody").innerHTML = rows.map((row) =>
        '<tr>' +
          '<td>' + escapeHtml(row.campus) + '</td>' +
          '<td class="left">' + escapeHtml(row.department) + '</td>' +
          '<td class="left">' + escapeHtml(row.unit) + '</td>' +
          '<td class="num">' + formatPct(row.openRate) + '</td>' +
          '<td class="num">' + formatPct(row.employmentRate) + '</td>' +
          '<td class="num emphasis-col">' + formatPct(row.openMinusEmployment) + '</td>' +
          '<td class="num">' + format(row.scheduleStaff) + '</td>' +
          '<td class="num">' + format(row.schedulableShifts) + '</td>' +
          '<td class="num">' + format(row.requiredShifts) + '</td>' +
          '<td class="num emphasis-col">' + format(row.remainingDays) + '</td>' +
          '<td class="num">' + format(row.avgRemaining) + '</td>' +
          '<td>' + signalBadge(row.signal) + '</td>' +
          '<td class="num shift-cell">' + format(row.dayShift) + '</td>' +
          '<td class="num shift-cell">' + format(row.eveningShift) + '</td>' +
          '<td class="num shift-cell">' + format(row.nightShift) + '</td>' +
          '<td class="num shift-cell">' + format(row.shiftTotal) + '</td>' +
        '</tr>'
      ).join("");
    }
    function downloadCsv(rows) {
      const cols = ["院區","科別","單位","開床率","在職率","開床-在職","人數","可排班數","四週上班需要班數","剩餘之休假人日數","平均剩餘人力","紅綠燈","D","E","N","小計"];
      const keys = ["campus","department","unit","openRate","employmentRate","openMinusEmployment","scheduleStaff","schedulableShifts","requiredShifts","remainingDays","avgRemaining","signal","dayShift","eveningShift","nightShift","shiftTotal"];
      const escapeCsv = (value) => '"' + String(value ?? "").replace(/"/g, '""') + '"';
      const csv = [cols.join(",")].concat(rows.map((row) => keys.map((key) => escapeCsv(row[key])).join(","))).join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "nursing_dashboard_filtered.csv";
      link.click();
      URL.revokeObjectURL(url);
    }
    function render() {
      renderDepartmentSelect();
      const rows = filteredRows();
      renderBar(rows);
      renderDetails(rows);
      document.querySelector("#downloadCsv").onclick = () => downloadCsv(rows);
    }
    document.querySelector("#campus").addEventListener("change", (event) => {
      state.campus = event.target.value;
      state.department = "全部科別";
      render();
    });
    document.querySelector("#departmentFilter").addEventListener("change", (event) => {
      state.department = event.target.value;
      render();
    });
    render();
  </script>
</body>
</html>
